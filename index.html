// ══ UTILS ══════════════════════════════════════════════════════════
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ══ API LAYER (live + demo fallback) ══════════════════════════════
async function api(action, params={}){
  if(!API_URL){
    return demoHandler(action, params);
  }
  const formData = new URLSearchParams();
  const token = sessionStorage.getItem('cb_token')||'';
  Object.entries({action, token, ...params}).forEach(([k,v])=>{
    formData.append(k, typeof v==='object'&&v!==null ? JSON.stringify(v) : String(v??''));
  });
  try {
    const r = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body: formData.toString()
    });
    const json = await r.json();
    if(!json.ok) throw new Error(json.error||'api_error');
    return json.data;
  } catch(err) {
    console.warn('[Cyrabell] API error, falling back to demo data:', err.message);
    return demoHandler(action, params);
  }
}

// ══ DEMO HANDLER ══════════════════════════════════════════════════
function demoHandler(action, params){
  const u = STATE.user;
  switch(action){
    case 'login': {
      const staffMap = {'admin@cyrabell.test':'admin','lawyer1@cyrabell.test':'lawyer','lawyer2@cyrabell.test':'lawyer'};
      const role = staffMap[params.email] || 'client';
      const token = btoa(JSON.stringify({email:params.email, role, exp:Date.now()+8*3600*1000}))+'.demosig';
      return {token, user:{email:params.email, role}};
    }
    case 'requestOtp': return {sent:true, demo_otp:'123456'};
    case 'verifyOtp': {
      if(params.otp!=='123456') throw new Error('invalid_otp');
      const token = btoa(JSON.stringify({email:params.email, role:'client', exp:Date.now()+8*3600*1000}))+'.demosig';
      return {token, user:{email:params.email, role:'client'}};
    }
    case 'booking_list': return filterByRole(DEMO.bookings, 'booking');
    case 'booking_availability': {
      const taken = DEMO.bookings.filter(b=>b.date===params.date&&b.lawyer_email===params.lawyer_email&&b.status!=='cancelled').map(b=>b.time_slot);
      const all=['09:00','10:00','11:00','13:00','14:00','15:00','16:00'];
      return {date:params.date, lawyer:params.lawyer_email, available:all.filter(s=>!taken.includes(s))};
    }
    case 'booking_create': {
      const b={booking_id:uid('BK'), client_id:params.client_id||u?.email, lawyer_email:params.lawyer_email, mode:params.mode||'online', date:params.date, time_slot:params.time_slot, status:'pending', meeting_link:params.mode==='online'?'https://meet.google.com/lookup/'+uid('demo').toLowerCase():'', qr_code_data:'CHECKIN:'+uid('BK')};
      DEMO.bookings.unshift(b); return b;
    }
    case 'booking_update': {
      const b=DEMO.bookings.find(x=>x.booking_id===params.booking_id);
      if(!b) throw new Error('not_found');
      Object.assign(b, params); return b;
    }
    case 'booking_checkin': {
      const id=(params.qr||'').replace('CHECKIN:','');
      const b=DEMO.bookings.find(x=>x.booking_id===id);
      if(!b) throw new Error('Booking not found');
      b.status='checked-in'; return {ok:true,booking_id:id,status:'checked-in'};
    }
    case 'client_list': return DEMO.clients;
    case 'client_create': {
      const c={client_id:uid('CLT'),full_name:params.full_name,email:params.email,phone:params.phone||'',risk_level:params.risk_level||'low',assigned_lawyer_email:params.assigned_lawyer_email||'',pref_notification_channels:'["email"]'};
      DEMO.clients.push(c); return c;
    }
    case 'case_list': return filterByRole(DEMO.cases,'case');
    case 'case_create': {
      const c={case_id:uid('CASE'),client_id:params.client_id,case_type:params.case_type,status:'open',filing_date:params.filing_date||today(),court_details:params.court_details||'',opposing_party:params.opposing_party||'',predicted_duration_months:6};
      DEMO.cases.unshift(c); return {...c, ai_prediction:{predicted_months:6,confidence:.4,reason:'Demo prediction'}};
    }
    case 'case_update': {
      const c=DEMO.cases.find(x=>x.case_id===params.case_id);
      if(!c) throw new Error('not_found');
      Object.assign(c,params); return c;
    }
    case 'case_conflict_check': {
      const q=String(params.opposing_party||'').toLowerCase().trim();
      if(!q) return {conflicts:[]};
      const conflicts=[];
      DEMO.clients.forEach(c=>{ if(c.full_name&&c.full_name.toLowerCase().includes(q.slice(0,4))) conflicts.push({type:'existing_client',match:c.full_name,score:.85}); });
      return {conflicts};
    }
    case 'document_list': return DEMO.documents.filter(d=>d.case_id===params.case_id);
    case 'document_register': {
      const d={doc_id:uid('DOC'),case_id:params.case_id,name:params.name,drive_url:params.drive_url||'',uploaded_by:u?.email||'staff',timestamp:new Date().toISOString(),ai_tags:'["general"]'};
      DEMO.documents.push(d); return d;
    }
    case 'time_list': return DEMO.timeEntries.filter(e=>e.case_id===params.case_id);
    case 'time_add': {
      const hours=Math.round(parseFloat(params.hours||0)*10)/10, rate=parseFloat(params.rate||0);
      const e={entry_id:uid('TE'),case_id:params.case_id,lawyer_email:u?.email||'lawyer',hours,description:params.description||'',rate,amount:hours*rate};
      DEMO.timeEntries.push(e); return e;
    }
    case 'invoice_list': return DEMO.invoices;
    case 'invoice_create': {
      const entries=DEMO.timeEntries.filter(e=>e.case_id===params.case_id);
      const total=entries.reduce((s,e)=>s+parseFloat(e.amount||0),0);
      const inv={invoice_id:uid('INV'),case_id:params.case_id,total_amount:total,status:'unpaid',pdf_url:'',predicted_overdue_risk:22};
      DEMO.invoices.push(inv); return inv;
    }
    case 'ai_predict_duration': return {predicted_months:6,confidence:.45,reason:'Based on similar demo cases',similar_case_id:'CASE-DEMO0001'};
    case 'ai_suggest_lawyer': return {recommended_lawyer_email:'lawyer1@cyrabell.test',reason:'win_rate=0.80, load=2, specialisation=1'};
    case 'ai_overdue_risk': return {risk_percent:22,expected_date:addDays(30),confidence:.6};
    case 'ai_retrain': return {duration:{trained:false,reason:'Demo mode — no retraining'},overdue:{trained:false}};
    case 'analytics_dashboard': {
      const open=DEMO.cases.filter(c=>c.status!=='closed').length;
      const closed=DEMO.cases.filter(c=>c.status==='closed').length;
      const byType={},byStatus={};
      DEMO.cases.forEach(c=>{byType[c.case_type]=(byType[c.case_type]||0)+1;});
      DEMO.bookings.forEach(b=>{byStatus[b.status]=(byStatus[b.status]||0)+1;});
      return {clients_total:DEMO.clients.length,cases_open:open,cases_closed:closed,bookings_pending:DEMO.bookings.filter(b=>b.status==='pending').length,invoices_unpaid:DEMO.invoices.filter(i=>i.status==='unpaid').length,invoices_overdue:0,cases_by_type:byType,bookings_by_status:byStatus};
    }
    case 'notify_log': return DEMO.notifLog;
    case 'action_log_list': return DEMO.actionLog;
    default: throw new Error('Unknown action: '+action);
  }
}

function filterByRole(arr, type){
  const u = STATE.user;
  if(!u) return [];
  if(isAdmin()) return arr;
  if(isLawyer()){
    if(type==='booking') return arr.filter(b=>b.lawyer_email===u.email);
    if(type==='case'){
      const myClients=DEMO.clients.filter(c=>c.assigned_lawyer_email===u.email).map(c=>c.client_id);
      return arr.filter(c=>myClients.includes(c.client_id));
    }
  }
  if(type==='booking') return arr.filter(b=>b.client_id===u.email);
  if(type==='case'){
    const myId=DEMO.clients.find(c=>c.email===u.email)?.client_id;
    return arr.filter(c=>c.client_id===myId);
  }
  return arr;
}

}

function restoreSession(){
  const raw = sessionStorage.getItem('cb_user');
  const token = sessionStorage.getItem('cb_token');
  if(!raw||!token) return null;
  try{
    // parse expiry from token payload (base64 before first dot)
    const payload = JSON.parse(atob(token.split('.')[0].replace(/-/g,'+').replace(/_/g,'/')));
    if(payload.exp < Date.now()){ sessionStorage.clear(); return null; }
    const u = JSON.parse(raw);
    setUser(u);
    return u;
  }catch(_){ sessionStorage.clear(); return null; }
}

function doLogout(){
  sessionStorage.removeItem('cb_token');
  sessionStorage.removeItem('cb_user');
  setUser(null);
  document.getElementById('app-shell').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
  toast('Signed out','info');
}

const VIEWS = {};
function registerView(name, fn){ VIEWS[name]=fn; }

async function navigate(name){
  const outlet = document.getElementById('main-outlet');
  const fn = VIEWS[name];
  if(!fn){ outlet.innerHTML=`<div class="p-8 text-center font-mono text-ink-muted">View not found: ${esc(name)}</div>`; return; }
  document.getElementById('page-title').textContent = name.charAt(0).toUpperCase()+name.slice(1);
  outlet.innerHTML = spinner();
  outlet.classList.add('view-enter');
  // Mark active nav
  document.querySelectorAll('[data-route]').forEach(l=>l.classList.toggle('active', l.dataset.route===name));
  try { await fn(outlet); }
  catch(err){ outlet.innerHTML=`<div class="p-8 text-center"><p class="font-mono text-red-700 text-sm">${esc(err.message)}</p></div>`; console.error(err); }
}

  let conflictTimer;
  document.getElementById('opp-party')?.addEventListener('input',e=>{
    clearTimeout(conflictTimer);
    conflictTimer=setTimeout(async()=>{
      const q=e.target.value.trim(); const el2=document.getElementById('conflict-result');
      if(!q||!el2){el2&&el2.classList.add('hidden');return;}
      try{
        const {conflicts}=await api('case_conflict_check',{opposing_party:q});
        el2.classList.remove('hidden');
        el2.innerHTML=conflicts.length?`<div class="text-xs text-red-700 border border-red-200 bg-red-50 rounded p-2">⚠ ${conflicts.length} potential conflict(s): ${conflicts.map(c=>esc(c.match)).join(', ')}</div>`:`<div class="text-xs text-emerald-700">✓ No conflicts found</div>`;
      }catch(_){el2.classList.add('hidden');}
    },500);
  });

  // AI suggestions
  document.getElementById('case-type-sel')?.addEventListener('change',async()=>{
    const panel=document.getElementById('ai-panel'); const content=document.getElementById('ai-content');
    panel.classList.remove('hidden'); content.innerHTML='<span class="animate-pulse">Loading AI recommendations…</span>';
    try{
      const [dur,sug]=await Promise.all([api('ai_predict_duration',{case_type:document.querySelector('[name=case_type]')?.value}),api('ai_suggest_lawyer',{case_type:document.querySelector('[name=case_type]')?.value})]);
      content.innerHTML=`<div class="grid grid-cols-2 gap-3"><div><p class="text-ink-muted font-mono text-xs mb-0.5">Predicted Duration</p><p class="text-2xl font-display text-ink">${esc(String(dur.predicted_months))} <span class="text-sm">months</span></p><p class="text-xs text-ink-muted">${esc(dur.reason||'')}</p></div><div><p class="text-ink-muted font-mono text-xs mb-0.5">Suggested Lawyer</p><p class="text-sm text-ink">${esc(sug.recommended_lawyer_email)}</p><p class="text-xs text-ink-muted">${esc(sug.reason||'')}</p></div></div>`;
    }catch(_){content.innerHTML='<span class="text-xs text-ink-muted">AI unavailable</span>';}
  });

  document.getElementById('case-form')?.addEventListener('submit',async(e)=>{
    e.preventDefault();
    const fd=new FormData(e.target),data={};
    fd.forEach((v,k)=>data[k]=v);
    const btn=document.getElementById('case-submit-btn');
    btn.disabled=true; btn.textContent='Creating…';
    try{
      const c=await api('case_create',data);
      closeModal(); toast(`Case ${c.case_id} created`,'success'); navigate('cases');
    }catch(err){toast(err.message,'error');}
    finally{btn.disabled=false;btn.textContent='Create Case';}
  });
}

// ══ LOGIN WIRING ══════════════════════════════════════════════════
function showLoginError(msg){
  const el=document.getElementById('login-error');
  el.style.display='block'; el.textContent=msg;
}
function hideLoginError(){ document.getElementById('login-error').style.display='none'; }

document.getElementById('btn-request-otp')?.addEventListener('click',async()=>{
  const email=document.getElementById('auth-email')?.value?.trim();
  if(!email){ showLoginError('Please enter your email address'); return; }
  const btn=document.getElementById('btn-request-otp');
  btn.disabled=true; btn.textContent='Sending…'; hideLoginError();
  try{
    const res=await api('requestOtp',{email});
    document.getElementById('auth-step-1').classList.add('hidden');
    document.getElementById('auth-step-2').classList.remove('hidden');
    document.getElementById('otp-email-display').textContent=email;
    if(res.demo_otp){
      const h=document.getElementById('otp-hint');
      h.textContent=`Demo code: ${res.demo_otp}`;
      h.classList.remove('hidden');
    }
    document.getElementById('auth-otp')?.focus();
  }catch(err){ showLoginError(err.message||'Failed to send code. Check your connection.'); }
  finally{ btn.disabled=false; btn.textContent='Send Code'; }
});

document.getElementById('btn-verify-otp')?.addEventListener('click',async()=>{
  const email=document.getElementById('otp-email-display')?.textContent;
  const otp=document.getElementById('auth-otp')?.value?.trim();
  if(!otp||otp.length<6){ showLoginError('Enter the 6-digit code'); return; }
  const btn=document.getElementById('btn-verify-otp');
  btn.disabled=true; btn.textContent='Verifying…'; hideLoginError();
  try{
    const data=await api('verifyOtp',{email,otp});
    sessionStorage.setItem('cb_token',data.token);
    sessionStorage.setItem('cb_user',JSON.stringify(data.user));
    setUser(data.user);
    bootApp();
  }catch(err){ showLoginError('Invalid code. Try again or request a new one.'); }
  finally{ btn.disabled=false; btn.textContent='Verify & Login'; }
});

document.getElementById('auth-otp')?.addEventListener('input',e=>{
  if(e.target.value.length===6) document.getElementById('btn-verify-otp')?.click();
});
document.getElementById('auth-email')?.addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('btn-request-otp')?.click();
});
document.getElementById('btn-back')?.addEventListener('click',()=>{
  document.getElementById('auth-step-2').classList.add('hidden');
  document.getElementById('auth-step-1').classList.remove('hidden');
  hideLoginError();
});

document.querySelectorAll('.demo-login').forEach(btn=>{
  btn.addEventListener('click',async()=>{
    const email=btn.dataset.email;
    hideLoginError();
    // Disable all demo buttons during load
    document.querySelectorAll('.demo-login').forEach(b=>{ b.disabled=true; b.style.opacity='.6'; });
    try{
      const user=await doLogin(email);
      bootApp();
    }catch(err){
      showLoginError(`Login failed: ${err.message}`);
      document.querySelectorAll('.demo-login').forEach(b=>{ b.disabled=false; b.style.opacity='1'; });
    }
  });
});

// ══ BOOT ══════════════════════════════════════════════════════════
function bootApp(){
  const user=STATE.user;
  if(!user){ showLoginError('Could not load user session. Please try again.'); return; }
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  document.getElementById('sb-user-name').textContent=user.email.split('@')[0];
  document.getElementById('sb-user-email').textContent=user.email;
  document.getElementById('user-role-label').textContent=user.role.toUpperCase();
  // Role visibility
  document.querySelectorAll('.admin-only').forEach(el=>el.style.display=isAdmin()?'':'none');
  document.querySelectorAll('.staff-only').forEach(el=>el.style.display=isLawyer()?'':'none');
  // Nav wiring
  document.querySelectorAll('[data-route]').forEach(link=>{
    link.addEventListener('click',e=>{ e.preventDefault(); navigate(link.dataset.route); });
  });
  document.getElementById('btn-logout')?.addEventListener('click',doLogout);
  // Mode indicator
  document.getElementById('mode-indicator').textContent = API_URL ? '● Live' : '● Demo';
  document.getElementById('conn-label').textContent = API_URL ? 'Live' : 'Demo';
  if(!API_URL){
    document.getElementById('conn-status').classList.remove('text-emerald-600');
    document.getElementById('conn-status').classList.add('text-amber-500');
    document.querySelector('#conn-status span').classList.remove('bg-emerald-500');
    document.querySelector('#conn-status span').classList.add('bg-amber-400');
  }
  navigate('dashboard');
}

// ══ INIT ══════════════════════════════════════════════════════════
(function init(){
  const user=restoreSession();
  if(user){
    bootApp();
  }

  // Show/hide demo accounts based on whether API_URL is configured
  if(!API_URL){
    // No backend — show demo accounts and demo hint
    document.getElementById('demo-accounts-section')?.classList.remove('hidden');
    document.getElementById('mode-indicator').textContent='● Demo';
    // Show a subtle inline notice (not a banner)
    const hint = document.createElement('p');
    hint.className = 'text-center font-mono text-xs text-amber-600 mt-3';
    hint.textContent = 'Running in demo mode — set API_URL to connect backend';
    document.getElementById('auth-step-1')?.appendChild(hint);
  } else {
    // Live mode — hide demo accounts entirely, show live indicator
    document.getElementById('demo-accounts-section')?.classList.add('hidden');
    document.getElementById('mode-indicator').textContent='● Live';
    document.getElementById('mode-indicator').classList.remove('text-gold');
    document.getElementById('mode-indicator').classList.add('text-emerald-600');
  }

  // Keyboard shortcuts
  document.addEventListener('keydown',e=>{
    if(!STATE.user) return;
    const ctrl=e.ctrlKey||e.metaKey;
    if(e.key==='Escape') closeModal();
    if(ctrl&&e.key==='n'){ e.preventDefault(); navigate('bookings'); setTimeout(openNewBookingModal,200); }
    if(ctrl&&e.key==='d'){ e.preventDefault(); navigate('dashboard'); }
    if(ctrl&&e.key==='b'){ e.preventDefault(); navigate('bookings'); }
    if(ctrl&&(e.shiftKey&&e.key==='C')){ e.preventDefault(); navigate('cases'); }
    if(ctrl&&e.key==='k'){ e.preventDefault(); navigate('admin'); setTimeout(()=>document.getElementById('global-search')?.focus(),200); }
  });
  // Expose navigate globally for inline onclick
  window.navigate=navigate;
})();
</script>
</body>
</html>
